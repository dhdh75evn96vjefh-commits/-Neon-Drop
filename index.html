<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>NEON MATCH — لعبة مطابقة الألوان</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-wrap">
  <!-- لوحة الرسم -->
  <canvas id="game"></canvas>

  <!-- ===== واجهة المعلومات ===== -->
  <div id="hud">
    <div class="hud-left">
      <div class="hud-label">Score</div>
      <div id="score" class="hud-value">0</div>
      <div id="combo" class="hidden">×1</div>
    </div>
    <div class="hud-right">
      <div class="hud-label">Best</div>
      <div id="best" class="hud-value small">0</div>
      <div id="lives" class="lives"></div>
    </div>
  </div>

  <!-- ===== شاشة البداية ===== -->
  <div id="start-screen" class="overlay start-screen-overlay">
    <h1 class="title">NEON MATCH</h1>
    <p class="subtitle">جاهز لتحدّي الألوان؟</p>
    <button id="start-btn" class="btn">ابدأ اللعب</button>
    <div class="best-card" aria-label="أعلى نتيجة">
      <span class="best-card-label">أعلى نتيجة</span>
      <strong id="best-start">0</strong>
      <span class="best-card-caption">رقمك القياسي</span>
    </div>
  </div>

  <!-- ===== شاشة نهاية اللعبة ===== -->
  <div id="over-screen" class="overlay hidden">
    <h2 class="go-title">انتهت اللعبة</h2>

    <div class="score-box">
      <div class="score-item"><span>النقاط</span><strong id="final-score">0</strong></div>
      <div class="score-item"><span>أعلى نتيجة</span><strong id="best-score">0</strong></div>
      <div class="score-item"><span>أطول سلسلة</span><strong id="max-combo">0</strong></div>
    </div>

    <p id="new-record" class="new-record hidden">🎉 رقم قياسي جديد! 🎉</p>

    <button id="restart-btn" class="btn">العب مرة أخرى</button>
    <button id="home-btn" class="btn btn-secondary">الصفحة الرئيسية</button>
    <button id="share-btn" class="btn btn-share">Share Score</button>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
